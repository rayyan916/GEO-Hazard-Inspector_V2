<script>
'use strict';
const $=id=>document.getElementById(id),KEY='quake-frontline-v1';
const labels={knowledge:'地質知識',analysis:'資料分析',coordination:'協調溝通',fitness:'體能',fatigue:'疲勞',budget:'資源',warning:'監測預警',buildings:'建築安全',planning:'疏散規劃',public:'公眾應變',rescue:'救援保障',trust:'公眾信任'};
const jobs=[
{id:'expert',icon:'🧑‍🔬',name:'與專家溝通',desc:'理解板塊活動，評估各地防災政策。',cost:2,tired:5,gain:{knowledge:6,coordination:3,planning:2}},
{id:'monitor',icon:'📡',name:'監測系統與 GIS',desc:'疊加地質與人口資料，辨識高風險區。',cost:3,tired:7,gain:{analysis:6,warning:6}},
{id:'government',icon:'🏛️',name:'與政府部門開會',desc:'推動建築規管、疏散及救援配套。',cost:4,tired:6,gain:{coordination:6,buildings:5,planning:4,rescue:2}},
{id:'publicity',icon:'📣',name:'向市民宣傳',desc:'破解迷思，讓居民掌握自救及撤離。',cost:2,tired:5,gain:{coordination:3,public:6,trust:4}},
{id:'field',icon:'🧭',name:'實地考察',desc:'檢視斜坡、土壤、樓宇和道路脆弱性。',cost:3,tired:9,gain:{analysis:4,knowledge:3,buildings:3,planning:3}},
{id:'training',icon:'🎒',name:'防災訓練',desc:'練習安全撤離、急救協作與物資搬運。',cost:1,tired:9,gain:{fitness:8,rescue:6,public:2}},
{id:'rest',icon:'🌙',name:'休息與整理',desc:'恢復狀態、整理研究札記和補充資源。',cost:0,tired:-25,gain:{fitness:2,budget:5}}
];
// 每題：問題、正確選項、兩個干擾選項、解析。顯示時隨機排列選項。
const bank={
expert:[
['地震形成的核心過程是甚麼？','岩石累積應力後斷裂，釋放能量','風力令地殼搖晃','海水溫度下降令岩石收縮','板塊相對運動可令斷層附近累積應力，岩石突然破裂或滑動時釋放地震波。'],
['震源與震央的關係是甚麼？','震央是震源垂直上方的地表位置','震央必定在海面，震源必定在岸上','兩者是同一個地下位置','震源是地下開始破裂的位置；震央是它垂直上方的地表點。'],
['兩塊板塊水平擦過，主要涉及哪種力？','剪切力與水平滑動斷層','張力與正斷層','單純向上浮力','保守性板塊邊界以水平相對運動為主；摩擦可阻礙滑動，使應力累積。'],
['海洋板塊與大陸板塊聚合時，哪個解釋較合理？','較高密度的海洋板塊可俯衝到另一板塊之下','兩塊板塊一定同時上升','密度較低的板塊必定先俯衝','破壞性邊界的俯衝活動可造成地震及火山活動；不是每種聚合都具有相同構造。'],
['板塊背向移動時，較常出現哪種組合？','張力、正斷層及新地殼形成','剪切力、水平滑動且沒有裂縫','擠壓力及兩塊大陸相撞','建設性邊界的分離運動讓岩漿上湧形成新地殼，亦可沿斷層產生地震。'],
['遠離板塊邊界的城市是否完全沒有地震風險？','不是，板內斷層亦可累積應力並移動','是，只有板緣才能地震','是，只要沒有火山便安全','板內地震提醒我們，風險評估不能只看與板塊邊界的距離。'],
['夏威夷火山鏈的形成主要反映甚麼？','板塊移動經過相對固定的熱點','所有島嶼沿同一俯衝帶形成','海嘯把海底抬升成所有火山','熱柱促使岩漿上升，板塊持續移動形成火山鏈。'],
['海嘯形成最關鍵的海底變化是甚麼？','海底快速大規模垂直位移，擾動水柱','任何輕微地震一定造成巨浪','海面被風吹皺','並非所有地震都引發海嘯；震源位置、深度和斷層位移方式都重要。'],
['火山灰對人類活動可有哪種長期好處？','風化後提供礦物質，改善部分土壤肥力','立即讓所有農田免受災害','永久阻止任何地震','火山活動有機會與風險；肥沃土壤、地熱和旅遊收益不能消除爆發危險。'],
['同一震級在兩地造成不同破壞，應如何評估政策？','比較震源距離、地質、人口與建築脆弱性','只比較震級，其他因素不重要','只選擇最富裕國家的做法照搬','災害損失由自然因素、暴露人口和脆弱性共同影響；政策須配合當地條件。'],
['防災政策文件完整，但巡查不足，最可能出現甚麼問題？','法例缺乏執行，危險樓宇仍可能倒塌','文件會自動令樓宇抗震','只須增加宣傳海報便可代替工程','制定法例和有效執法須配合；巡查、工程品質及財政能力影響成效。'],
['強震後為何仍需注意餘震？','主震後仍可出現較強震動，損壞樓宇可能再倒塌','餘震永遠不會造成損失','只有主震前才有餘震','餘震可持續一段時間；應限制進入受損建築並等待專業評估。']
],
monitor:[
['GIS 要找出高風險居民，最有用的疊圖組合是甚麼？','地震危險度、人口、建築及地質圖層','只有行政區顏色','只有旅遊景點位置','GIS 能結合危險度、暴露度和脆弱性，支援防災資源分配。'],
['過往地震記錄能可靠提供甚麼？','長期危險度及概率評估','下一次大地震的確切日期與時間','保證未曾地震的地方永遠安全','目前不能可靠預測地震的確切時間、地點和震級。長期概率不是確定預言。'],

險物洩漏及經濟損失的連鎖風險", "工業用途會自動加固地殼", "只關注道路顏色", "土地用途影響暴露資產及次生危險，工業區需配套評估。"], ["遠離震央的鬆軟地盤仍有明顯損害，如何分析？", "結合地盤放大、建築脆弱性和實際震動", "距離遠就證明所有報告是假", "損害必定與地震無關", "距離並非唯一影響因素，地質和樓宇條件亦重要。"], ["考察火山坡下河谷，暴雨後要關注甚麼？", "雨水與火山碎屑混合形成泥流的可能", "所有雨水必定令火山灰完全無害", "河谷位置不影響危險", "火山物質可被水搬運形成泥流，威胁下游聚落和道路。"], ["海嘯退去後港口滿布碎片，代表甚麼工作需要？", "安全評估、清理與恢復運輸生命線", "立即讓所有船隻任意進出", "港口受損只影響海浪觀賞", "港口功能關係物資和經濟活動，恢復需安全及工程評估。"], ["水庫附近居民報告河水突然升高，應如何處理？", "核查設施受損與下游洪水風險，通報並協助安全安排", "立刻保證水壩沒有問題", "只按天氣晴朗便排除所有泛濫", "地震可能損壞水工設施，需及時核查可能的次生洪水。"], ["考察資料只涵蓋容易到達的街道，有何局限？", "偏遠或受阻區可能被低估，需補充資料", "容易到達便代表整區所有情況", "把其他地區標記為完全無損", "資料覆蓋不足可造成評估偏差，要清楚標明未調查區域。"]], "training": [["撤離隊進入安全空地前，須先查看甚麼？", "是否遠離外牆、電線、斜坡及其他危險", "空地有沒有好看的布置", "空地名字是否包含安全兩字", "集合點安全須根據現場條件，不只看名称或空間大小。"], ["警報演練時居民聽到但不知道下一步，應改進甚麼？", "給清晰行動指示、路線和實際示範", "只增加警報音量", "把居民一律當成不願配合", "收到訊息與知道如何應變不同，演練應連結警報與行動。"], ["同伴因過勞反應變慢，你應如何分工？", "調整任務及轮班，讓其休息恢復", "要求其獨自承擔最危險工作", "將疲勞視為勇氣不足", "過勞影響判斷和身體能力，安全分工有助保持整體救援成效。"], ["物資發放點擠塞，如何安排較合理？", "建立清晰隊列與優先照顧弱勢的安排", "讓所有人同時推擠取物資", "停止所有資訊公布", "秩序、資訊和公平安排可減少混亂，保障弱勢居民取得需要。"], ["演練中主要出口被假設堵塞，應怎樣應變？", "使用事先評估的替代安全出口", "所有人擠在堵塞出口等待", "任意跳到未評估的危險區域", "備用路線與實際演習可增強應變彈性，但仍須評估安全。"], ["急救訓練後，新人是否可獨立執行所有醫療處置？", "不可，須按受訓範圍及專業指示協助", "可以，一次訓練等於所有專科資格", "可以，只要個人體能高", "培訓提升有限範圍的能力，不能替代專業醫療資格和安全判斷。"], ["無線電演練時最值得傳達的資訊是甚麼？", "位置、風險、需要與已採取行動", "只有個人情緒和猜測", "只有未核實的最大傷亡數字", "清楚、可核實且與任務相關的資訊有助協調資源。"], ["海嘯撤離演練中有人想先回家，應怎樣說明？", "先沿安全路線撤離，取物品可能延誤避險", "每人必須先回家才能撤離", "只要步行慢便一定安全", "海嘯可能迅速到達，事前準備可減少临時回家取物的需要。"], ["救援集合時發生餘震，隊伍應怎樣做？", "按所在位置采取安全掩護，重新確認現場風險", "把餘震視為必定沒有破壞", "立刻全部進入受損樓宇", "餘震可令受損設施進一步失穩，隊伍須持續更新安全安排。"], ["搬運練習只追求速度而忽略能力差異，有何問題？", "容易過度負荷和受傷，削弱後續支援", "速度越快就不可能受傷", "體能低的人不需要任何安排", "體能訓練須配合合理負荷、技巧與休息。"], ["避難中心演練發現飲水不足，下一步應做甚麼？", "估計需求並安排儲備、補給及衛生保障", "只增加宣傳口號", "假定所有居民不需要飲水", "物資計劃須考慮人數、時間與供應中斷，飲水是基本需要。"], ["訓練後如何判斷演習是否有效？", "檢視行動是否安全、路線可行和弱勢是否獲協助", "只計算合照數目", "只看訓練是否令所有人非常疲累", "有效演練應改善實際應變能力，也要找出未解決的缺口。"]], "rest": [["你連續多日工作後安排休息，最合理的目的為何？", "恢復狀態，讓後續判斷和工作更可靠", "證明地區不再有任何風險", "讓地震自動延後發生", "休息影響個人能力發挥，不能改變地震日期或危險度。"], ["復盤發現題目全答對但疏散規劃低，應如何調整？", "把知識轉化為政府協調和實際疏散工作", "只繼續提高已最高的能力", "認定答題好便不需要制度", "學習表現不等於地區準備，能力須转化為可用的措施。"], ["整理工作記錄時，為何保留錯誤答案也有用？", "辨認迷思與薄弱概念，安排針對性的學習", "錯誤記錄會直接引發地震", "只有完全正確的記錄才有教育價值", "復盤需要了解失誤及原因，才能改善判斷而非只追求分數。"], ["下週資源有限，如何安排工作較合理？", "依最弱環節和風險優先排序，預留恢復時間", "把所有資源花在同一數值不看需要", "完全忽略成本和疲勞", "育成的重点是多項能力的平衡和實際需要，而非單一最高值。"], ["你發現公眾信任下降，休息復盤時應留意甚麼？", "有否發布未核實消息或過度保證", "市民是否都應停止接收資訊", "是否可用隐藏錯誤解決問題", "可靠沟通包含核實、说明局限及修正錯誤，有助恢復信任。"], ["災後回顧只記錄樓宇修復數量，有甚麼不足？", "忽略居民生活、心理及服務恢復", "樓宇數量可代表所有復原情況", "社區復原不需要居民參與", "復原成效須多方面評估，包括基建、生活、經濟和心理支援。"], ["休息時檢查地震資料來源，最應保存甚麼？", "發布機構、時間和更新版本", "只有最驚人的標題", "只保存沒有日期的截圖", "地震與災情資料可能修訂，來源和時間讓分析可追溯。"], ["再玩一次育成前，哪個反思最有用？", "找出成效不足的原因，調整工作、休息與地區準備", "只記住最高分答案而不理解", "只追求不睡覺的最長工作日數", "把概念、策略和成效連結起來，才能把遊戲經驗化為可應用的理解。"]]};

function results(){let total=s.cr.reduce((a,r)=>a+r.score*crisis[r.i].weight,0)/crisis.reduce((a,c)=>a+c.weight,0),p=(s.stats.knowledge+s.stats.analysis+s.stats.coordination+s.stats.fitness)/4,d=(s.stats.warning+s.stats.buildings+s.stats.planning+s.stats.public+s.stats.rescue)/5,correct=s.cr.filter(r=>r.correct).length;let idx;if(!s.cr[3].correct)idx=5;else if(s.stats.trust<30&&correct<=5)idx=6;else if(s.stats.fatigue>=80||s.stats.fitness<18)idx=4;else if(total>=72&&correct>=8&&d>=55)idx=0;else if(total>=63&&s.stats.rescue>=50&&s.stats.planning>=45)idx=1;else if(s.stats.public>=55&&s.stats.trust>=60&&total>=57)idx=2;else if(p>=52&&d<43)idx=3;else idx=7;return{idx,total:Math.round(total),p:Math.round(p),d:Math.round(d),correct}}
const endingText=[
'你把研究轉化成制度、工程和社區行動。震動仍造成損害，但預警、撤離與救援形成多層防線。你獲邀統籌下一階段韌性計劃。',
'道路與通訊曾受阻，但預先準備的替代通道和救援協作派上用場。團隊守住了基本服務；下一步是補強較弱的工程或教育環節。',
'居民記得演習路線，願意配合撤離並互相照顧。你的宣傳建立了信任。部分基建仍受損，顯示教育須與工程和制度配合。',
'你能解讀地震和風險資料，但地區的制度、建築或救援準備未能跟上。正確分析難以迅速落實。你決心把下一期研究帶進社區與政府部門。',
'你投入大量工作，卻在關鍵時刻受到過勞或身體狀態拖累。團隊接手部分職務，你開始理解：安排休息與安全行動，也是專業責任。',
'面對沿岸自然警訊，你未採取適當的撤離策略。模擬中的居民因此暴露於可避免的危險，外援介入協助。你在復盤中重新建立海嘯警訊與安全行動的連結。',
'錯誤資訊和不合適的決策削弱了居民信任。措施難以落實，團隊需重新建立透明溝通。你開始學習在不確定情況下如何負責任地說明風險。',
'你完成了第一次大型應變，團隊勉強維持基本秩序，但多項準備缺口仍然明顯。這段經歷成為成長的起點：把薄弱環節逐項改善，比追求單一最高數值更有用。'
];
function renderEnding(){let r=results(),weak=['warning','buildings','planning','public','rescue'].sort((a,b)=>s.stats[a]-s.stats[b]).slice(0,2),tips={warning:'結合多種監測和備援；區分長期概率、預警及精確預測。',buildings:'優先評估和加固重要設施及高脆弱樓宇，確保法例有實際執行。',planning:'更新風險地圖、疏散路線及弱勢居民安排，避免高危選址。',public:'增加演習及易懂的多渠道資訊，反覆練習地震和海嘯安全行動。',rescue:'完善物資、飲水、醫療、替代道路及備援通訊。'};$('app').innerHTML=frame(`<section class="panel endingPanel"><div class="eyebrow">EPILOGUE · ENDING ${r.idx+1}/8</div><h1 class="ending">${endTitles[r.idx]}</h1><p class="endingStory" style="font-size:18px;margin-top:22px">${endingText[r.idx]}</p><div class="scorecards"><div>綜合應變成效<strong>${r.total}</strong>/100 · 模擬指標</div><div>地區準備平均<strong>${r.d}</strong>/100 · 五項能力</div><div>危機判斷<strong>${r.correct}/9</strong>答對關卡</div></div><div class="callout">結局依應變選擇、個人能力、疲勞、公眾信任與地區準備共同決定。分數不代表真實傷亡率，這個故事也不是巴拿馬實際災情的重演。</div><h3>你的育成足跡</h3><div class="changes">${jobs.map(j=>`<span>${j.name} ${s.counts[j.id]||0}天</span>`).join('')}</div><p>日常答題：${s.log.filter(x=>x.correct).length}/${s.log.length} 正確。個人能力平均：${r.p}/100。</p><h3>下一輪最值得改善的環節</h3>${weak.map(k=>`<p><b>${labels[k]}（${Math.round(s.stats[k])}）：</b>${tips[k]}</p>`).join('')}<details style="margin:18px 0"><summary>查看9項危機判斷與你的分析</summary>${s.cr.map(x=>`<div class="logitem"><b>${crisis[x.i].title} · ${x.correct?'正確':'需修正'} · ${Math.round(x.score)}分</b><p>${esc(crisis[x.i].opts[x.a])}</p><small>${crisis[x.i].ex}</small>${x.reason?`<p>你的分析：${esc(x.reason)}</p>`:''}</div>`).join('')}</details><label for="reflection">最後反思（選填，儲存於日誌）</label><textarea id="reflection" class="notes" maxlength="3000" placeholder="哪些準備最有效？哪些數值不足？若再值勤70天，你會如何調整工作？">${esc(s.reflection||'')}</textarea><div class="tools" style="margin-top:18px"><button class="primary" id="export">下載學習紀錄</button><button id="again">重新育成</button></div><details style="margin-top:20px"><summary>8種結局與判定規則</summary><p>按以下優先次序判定，確保每次只得到一個結局。</p><ol><li>錯失的撤離窗口：第4關選擇不合適。</li><li>失去信任的指揮臺：信任＜30，危機答對≤5題。</li><li>疲憊的英雄：最終疲勞≥80或體能＜18。</li><li>韌性之城：成效≥72、答對≥8、地區平均≥55。</li><li>守住生命線：成效≥63、救援≥50、疏散≥45。</li><li>社區的守護者：公眾應變≥55、信任≥60、成效≥57。</li><li>孤掌難鳴的專家：個人平均≥52，但地區平均＜43。</li><li>重建中的新手：其餘情況。</li></ol></details></section>`);$('reflection').oninput=()=>{s.reflection=$('reflection').value;persist()};$('export').onclick=exportReport;$('again').onclick=confirmReset}
function showModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').showModal()}
function guide(){showModal('遊戲指南與事件資料',`<h3>育成規則</h3><p>8月1日至10月9日共70天，每天選擇一項工作或休息並回答相關短題。工作不能取消，答題及完成日狀態會自動保存。每種工作的題目會在該題庫用完前避免重複；用完後循環。共有160條日常題目及9條危機題目。</p><p>工作成本和疲勞不論答對或答錯都會生效。答對獲完整能力提升；答錯獲20%，另扣信任3。疲勞≥75時，工作增益再乘45%，另扣體能4。休息減疲勞25、增體能2及資源5，恢復不受折減；休息題答錯扣信任1。各數值範圍0–100，每完成7天補給資源9。資源不足的工作會停用，可選休息。</p><h3>危機成效</h3><p>每關成效＝個人相關能力×（1−當時疲勞÷160）×30%＋地方相關能力×40%＋正確判斷×30%。答對時正確判斷為100，答錯為0。綜合成效按各關權重取平均。每關增加疲勞；錯誤策略扣信任，危險個人行動亦扣體能。選填分析只記錄，不以關鍵字自動判分。</p><h3>真實事件與虛構故事</h3>${fact()}<p>事件初報會修訂，7.6及7.7的記錄反映不同報告與更新。沒有把海嘯模型當成實測浪高，也沒有使用未核實傷亡數字。玩家的事前任務不具預知10月10日地震的能力。</p><h3>科學澄清</h3><ul><li>地震不能可靠預測確切日期、時間及震級；地震預警在地震開始後發出。</li><li>不是每次地震均造成海嘯；沿岸強烈或持續震動後應按安全指引撤往高地或內陸。</li><li>不將動物異常當作確定預測，不將斷層注水當作常規安全減災。</li><li>災後疫病主要與飲水、衛生、擠迫及醫療中斷相關。</li><li>教學主要採用構造災害成因、直接與次生影響、防災措施及破壞程度因素；對部分教材敘述作以上必要澄清。</li></ul><h3>查證連結</h3><ul><li><a href="https://earthquake.usgs.gov/earthquakes/eventpage/us6000u18k/technical" target="_blank" rel="noopener">USGS：巴拿馬地震事件</a></li><li><a href="https://www.gdacs.org/Earthquakes/report_shakemap.aspx?episodeid=1738684&eventid=1570339&eventtype=EQ" target="_blank" rel="noopener">GDACS：事件時間與更新記錄</a></li><li><a href="https://www.usgs.gov/centers/pcmsc/science/probabilistic-forecasting-earthquakes-tsunamis-and-earthquake-effects-coastal" target="_blank" rel="noopener">USGS：概率評估與預測限制</a></li><li><a href="https://www.usgs.gov/observatories/hvo/news/volcano-watch-practice-key-protecting-yourself-during-earthquake" target="_blank" rel="noopener">USGS：趴下、掩護、穩住</a></li><li><a href="https://www.weather.gov/safety/tsunami-during" target="_blank" rel="noopener">NOAA／NWS：海嘯自然警訊與撤離</a></li></ul><h3>存檔與裝置</h3><p>遊戲不傳送姓名或紀錄。使用同一瀏覽器及同一檔案位置繼續遊玩；無痕模式、清除資料或部分檔案瀏覽器可能不能保留存檔。手機先顯示簡短的每日工作按鈕，點選才開啟工作詳情並確認；能力、日誌及選單由下方導覽開啟。答題頁只集中顯示當前題目，選填分析與規則可展開。平板與電腦保留較完整的欄式資訊。若手機只顯示程式碼或檔案預覽，請用支援HTML的瀏覽器開啟。</p>`)}
function journal(){if(!s){toast('開始育成後即可查看日誌。');return}showModal('研究日誌',`<p>${esc(s.name)} · 已完成${s.log.length}天 · ${s.cr.length}個危機關卡</p><button id="journalExport" class="primary">下載目前學習紀錄</button>${s.log.length?s.log.slice().reverse().map(r=>`<div class="logitem"><b>${date(r.day)} · ${r.job} · ${r.correct?'正確':'需修正'}</b><p>${r.q}</p><small>你的選擇：${esc(r.chosen)}<br>合適答案：${r.answer}<br>${r.ex}</small>${chips(r.actual)}</div>`).join(''):'<p>尚未完成第一天工作。</p>'}`);$('journalExport').onclick=exportReport}
function exportReport(){if(!s)return;let text=`地震前線｜學習紀錄\n研究員：${s.name}\n已完成育成：${s.log.length}/70天\n所有地區能力、災情與結局均為教學模擬。\n\n目前數值\n`+Object.entries(labels).map(([k,v])=>`${v}：${s.stats[k]}`).join('\n')+'\n\n日常工作\n'+s.log.map(r=>`${date(r.day)} ${r.job}\n題目：${r.q}\n作答：${r.chosen}\n判斷：${r.correct?'正確':'需修正'}\n合適答案：${r.answer}\n解析：${r.ex}\n變化：${Object.entries(r.actual).map(([k,v])=>labels[k]+(v>=0?'+':'')+v).join('、')}\n`).join('\n')+'\n首要原則：'+s.notes+'\n\n危機判斷\n'+s.cr.map(r=>`${crisis[r.i].title}\n作答：${crisis[r.i].opts[r.a]}\n判斷：${r.correct?'正確':'需修正'}；成效${r.score}/100\n解析：${crisis[r.i].ex}\n個人分析：${r.reason||'未填寫'}\n`).join('\n');if(s.phase==='ending'){let r=results();text+=`\n結局：${endTitles[r.idx]}\n${endingText[r.idx]}\n綜合成效：${r.total}/100\n反思：${s.reflection||'未填寫'}\n`}let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='地震前線_學習紀錄.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function confirmReset(){if(!s)return;showModal('重新開始育成？','<p>這會清除目前的70天進度、日誌與結局。你可先下載學習紀錄。</p><div class="tools"><button id="backup">先下載紀錄</button><button id="confirmReset" class="danger">清除並重新開始</button></div>');$('backup').onclick=exportReport;$('confirmReset').onclick=()=>{s=null;try{localStorage.removeItem(KEY)}catch(e){}$('modal').close();render();window.scrollTo(0,0)}}

function openJob(id){
 const j=jobs.find(x=>x.id===id);if(!j||!s||s.phase!=='choose')return;
 if(innerWidth>700){choose(id);return}
 showModal(j.icon+' '+j.name,`<div class="workSheet"><p>${j.desc}</p><p class="muted">確認後回答一題，完成今天的工作。</p><h3>基本代價與恢復</h3>${chips({budget:-j.cost,fatigue:j.tired})}<h3>${j.id==='rest'?'休息恢復':'答對可獲得'}</h3>${chips(j.gain)}<p class="notice">${j.id==='rest'?'休息恢復不受答題或過勞折減；答錯信任−1。':'答錯仍花費資源並增加疲勞，提升只餘20%，信任−3。疲勞達75，提升再乘45%，體能−4。'}實際增幅受0–100上限限制。</p><button id="confirmJob" class="primary sheetAction" ${s.stats.budget<j.cost?'disabled':''}>確認今天進行${j.name} →</button></div>`);
 $('confirmJob').onclick=()=>{$('modal').close();choose(id)};
}
function abilityView(){if(!s){toast('開始育成後即可查看能力。');return}showModal('個人能力與地方準備',stats());const d=$('modalBody').querySelector('details');if(d)d.open=true}
function mobileMenu(){showModal('遊戲選單','<div class="answers"><button id="menuGuide">遊戲指南與事件資料</button><button id="menuSave">儲存目前進度</button><button id="menuExport">下載學習紀錄</button><button id="menuReset" class="danger">重新開始育成</button></div>');$('menuGuide').onclick=guide;$('menuSave').onclick=()=>{persist();toast(!s?'開始後會自動儲存。':storageOK?'已儲存目前進度。':'此瀏覽器未能保留存檔，請下載學習紀錄。')};$('menuExport').onclick=()=>s?exportReport():toast('尚未有學習紀錄。');$('menuReset').onclick=confirmReset}
$('mobileTask').onclick=()=>{if($('modal').open)$('modal').close();window.scrollTo({top:0,behavior:'smooth'})};$('mobileStats').onclick=abilityView;$('mobileJournal').onclick=journal;$('mobileMenu').onclick=mobileMenu;
$('help').onclick=guide;$('journal').onclick=journal;$('save').onclick=()=>{if(!s){toast('開始後會自動儲存。');return}persist();toast(storageOK?'已儲存目前進度。':'此瀏覽器未能保留存檔，請下載學習紀錄。')};$('reset').onclick=confirmReset;$('closeModal').onclick=()=>$('modal').close();render();
</script></body></html>
